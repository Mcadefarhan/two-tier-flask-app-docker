<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Board — Flask + MySQL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0a0c10;
    --panel: #12151c;
    --panel-2: #171b24;
    --border: #232733;
    --text: #e4e7ec;
    --text-dim: #8a92a3;
    --accent: #5eead4;
    --accent-dim: #2d6a63;
    --pulse: #f59e0b;
    --radius: 10px;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(94,234,212,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(245,158,11,0.04), transparent 40%);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 24px;
  }

  .card{
    width:100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow:hidden;
  }

  /* --- Header: connection topology (signature element) --- */
  .topology{
    padding: 28px 28px 22px;
    border-bottom: 1px solid var(--border);
  }

  .eyebrow{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
  }

  .nodes{
    display:flex;
    align-items:center;
    gap: 14px;
  }

  .node{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }

  .node-box{
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 10px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
  }

  .node--app .node-box{ border-color: var(--accent-dim); color: var(--accent); }
  .node--db .node-box{ border-color: rgba(245,158,11,0.35); color: var(--pulse); }

  .node-label{
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }

  .link{
    flex:1;
    height: 2px;
    position: relative;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    min-width: 40px;
  }

  .link::after{
    content:"";
    position:absolute;
    top:0; left:-30%;
    width:30%; height:100%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: travel 2.2s linear infinite;
  }

  @keyframes travel{
    0%{ left:-30%; }
    100%{ left:100%; }
  }

  h1{
    font-family: var(--mono);
    font-size: 1.35rem;
    font-weight: 700;
    margin-top: 20px;
    color: var(--text);
  }

  h1 span{ color: var(--accent); }

  .subtext{
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* --- Message log --- */
  .log{
    padding: 20px 28px;
    max-height: 260px;
    overflow-y: auto;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .log:empty::before{
    content: "No messages yet — send the first one below.";
    font-size: 0.85rem;
    color: var(--text-dim);
    font-style: italic;
  }

  .log-entry{
    display:flex;
    gap:10px;
    align-items:flex-start;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.9rem;
    line-height: 1.4;
    animation: enter 0.25s ease;
  }

  @keyframes enter{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .log-entry .tag{
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    margin-top: 2px;
    flex-shrink:0;
  }

  /* --- Composer --- */
  .composer{
    padding: 20px 28px 26px;
    border-top: 1px solid var(--border);
  }

  .prompt-row{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 4px 4px 14px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .prompt-row:focus-within{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(94,234,212,0.12);
  }

  .prompt-symbol{
    font-family: var(--mono);
    color: var(--accent);
    font-size: 14px;
    flex-shrink:0;
  }

  input[type="text"]{
    flex:1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    padding: 10px 0;
  }

  input[type="text"]::placeholder{ color: var(--text-dim); }

  button{
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #06110f;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
    flex-shrink:0;
  }

  button:hover{ filter: brightness(1.1); }
  button:active{ transform: scale(0.97); }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }

  .status-line{
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    min-height: 14px;
  }

  .status-line.error{ color: #f87171; }

  @media (prefers-reduced-motion: reduce){
    .link::after{ animation: none; }
    .log-entry{ animation: none; }
  }

  @media (max-width: 480px){
    .topology, .log, .composer{ padding-left: 18px; padding-right: 18px; }
    h1{ font-size: 1.15rem; }
    .node-box{ font-size: 11px; padding: 8px 12px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="topology">
      <div class="eyebrow">Two-tier deployment</div>
      <div class="nodes">
        <div class="node node--app">
          <div class="node-box">FLASK</div>
          <div class="node-label">web tier</div>
        </div>
        <div class="link"></div>
        <div class="node node--db">
          <div class="node-box">MYSQL</div>
          <div class="node-label">data tier</div>
        </div>
      </div>
      <h1>Message <span>board</span></h1>
      <div class="subtext">Every message you send is written straight to the database.</div>
    </div>

    <div class="log" id="log">
      {% for message in messages %}
        <div class="log-entry"><span class="tag">&gt;</span><span>{{ message[0] }}</span></div>
      {% endfor %}
    </div>

    <div class="composer">
      <form id="messageForm" autocomplete="off">
        <div class="prompt-row">
          <span class="prompt-symbol">&gt;</span>
          <input type="text" id="newMessage" name="new_message" placeholder="Type a message and press send…" required>
          <button type="submit" id="sendBtn">Send</button>
        </div>
      </form>
      <div class="status-line" id="statusLine"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('messageForm');
    const input = document.getElementById('newMessage');
    const log = document.getElementById('log');
    const status = document.getElementById('statusLine');
    const btn = document.getElementById('sendBtn');

    function addEntry(text){
      const el = document.createElement('div');
      el.className = 'log-entry';
      el.innerHTML = '<span class="tag">&gt;</span><span></span>';
      el.querySelector('span:last-child').textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      const message = input.value.trim();
      if(!message){
        status.textContent = 'Message cannot be empty.';
        status.classList.add('error');
        return;
      }

      status.classList.remove('error');
      status.textContent = 'Writing to database…';
      btn.disabled = true;

      fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'new_message=' + encodeURIComponent(message)
      })
      .then(function(res){
        if(!res.ok) throw new Error('Request failed');
        return res.json();
      })
      .then(function(data){
        addEntry((data && data.message) ? data.message : message);
        input.value = '';
        status.textContent = 'Saved.';
      })
      .catch(function(){
        status.textContent = 'Could not reach the server — is /submit configured?';
        status.classList.add('error');
      })
      .finally(function(){
        btn.disabled = false;
      });
    });
  </script>

</body>
</html>
